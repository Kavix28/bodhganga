# Production profile — values come from environment variables (.env or system env)
aws.s3.bucket-name=${AWS_S3_BUCKET:bodhganga-prod}
aws.region=${AWS_REGION:eu-north-1}

##################################################
# QUESTION BANK PIPELINE — Production overrides
##################################################
# Mount the service-account JSON as a secret volume and point to its path:
#   google.drive.qb.credentials=/etc/secrets/google-qb-credentials.json
# Or provide the QB_CREDENTIALS_PATH environment variable.
google.drive.qb.credentials=${QB_CREDENTIALS_PATH:classpath:google-qb-credentials.json}

# NEVER hardcode folder IDs in this file — always use environment variables in production.
google.drive.qb.source-folder-id=${QB_SOURCE_FOLDER_ID:REPLACE_WITH_SOURCE_FOLDER_ID}
google.drive.qb.archive-folder-id=${QB_ARCHIVE_FOLDER_ID:REPLACE_WITH_ARCHIVE_FOLDER_ID}

# Enable the pipeline via environment variable: QB_PIPELINE_ENABLED=true
google.drive.qb.pipeline.enabled=${QB_PIPELINE_ENABLED:false}

# 10-minute sync interval for production (override with QB_SYNC_INTERVAL_MS if needed)
google.drive.qb.sync-interval-ms=${QB_SYNC_INTERVAL_MS:600000}
