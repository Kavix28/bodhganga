# Server Configuration
server.port=${PORT:9090}

# MongoDB Configuration
spring.data.mongodb.uri=${MONGO_URI:${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/bodhganga}}
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
jwt.secret=${JWT_SECRET:test-only-secret-key-minimum-64-characters-long-replace-in-production-env}
jwt.expiration=${JWT_EXPIRATION:86400000}

# OTP Configuration (MSG91)
otp.enabled=${OTP_ENABLED:true}

# Payment Gateway (Razorpay)
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# Cloud Storage (AWS S3)
aws.access.key.id=${AWS_ACCESS_KEY_ID:mock-access-key-id-for-dev}
aws.secret.access.key=${AWS_SECRET_ACCESS_KEY:mock-secret-access-key-for-dev}
aws.region=${AWS_REGION:eu-north-1}
aws.s3.bucket.name=${AWS_S3_BUCKET:bodhganga-pdf-storage-prod}

# Email Integration (SMTP)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.health.mail.enabled=false

# Logging
logging.level.com.bodhganga=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# YouTube API
youtube.api.key=${YOUTUBE_API_KEY:}
youtube.channel.id=${YOUTUBE_CHANNEL_ID:}

# Google Drive Ingestion Pipeline
google.drive.pipeline.enabled=${GOOGLE_DRIVE_PIPELINE_ENABLED:${QB_PIPELINE_ENABLED:false}}
google.drive.credentials.path=${GOOGLE_DRIVE_CREDENTIALS_PATH:${QB_CREDENTIALS_PATH:classpath:google-credentials.json}}
google.drive.source-folder-id=${GOOGLE_DRIVE_SOURCE_FOLDER_ID:${QB_SOURCE_FOLDER_ID:}}
google.drive.archive-folder-id=${GOOGLE_DRIVE_ARCHIVE_FOLDER_ID:${QB_ARCHIVE_FOLDER_ID:}}

# Gemini AI
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

##################################################
# QUESTION BANK PIPELINE (Unified Hierarchy)
##################################################
google.drive.qb.credentials=${QB_CREDENTIALS_PATH:classpath:google-qb-credentials.json}
google.drive.qb.source-folder-id=${QB_SOURCE_FOLDER_ID:}
google.drive.qb.archive-folder-id=${QB_ARCHIVE_FOLDER_ID:}
google.drive.qb.pipeline.enabled=${QB_PIPELINE_ENABLED:false}
google.drive.qb.sync-interval-ms=${QB_SYNC_INTERVAL_MS:600000}
