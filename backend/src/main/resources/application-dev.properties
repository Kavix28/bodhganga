# Development profile — safe defaults for local development
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=dev

# JWT — dev-only secret (never use in production)
jwt.secret=dev-only-secret-key-minimum-64-characters-long-replace-in-production-env

# Actuator — expose more in dev
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=always

# Logging — verbose in dev
logging.level.com.bodhganga=DEBUG
logging.level.org.springframework.security=DEBUG

# Cloud Storage (AWS S3) — safe mock defaults for local development profile
aws.access.key.id=mock-access-key-id-for-dev
aws.secret.access.key=mock-secret-access-key-for-dev
aws.region=ap-south-1
aws.s3.bucket.name=bodhganga-dev-bucket

##################################################
# QUESTION BANK PIPELINE — Dev overrides
##################################################
# Credentials file must exist at src/main/resources/google-qb-credentials.json
google.drive.qb.credentials=classpath:google-qb-credentials.json

# Replace these with real folder IDs for local testing; pipeline stays off by default.
google.drive.qb.source-folder-id=${QB_SOURCE_FOLDER_ID:REPLACE_WITH_SOURCE_FOLDER_ID}
google.drive.qb.archive-folder-id=${QB_ARCHIVE_FOLDER_ID:REPLACE_WITH_ARCHIVE_FOLDER_ID}

# Keep false until folder IDs are set and credentials are verified
google.drive.qb.pipeline.enabled=false

# Faster sync interval in dev (3 minutes) for easier testing
google.drive.qb.sync-interval-ms=180000
