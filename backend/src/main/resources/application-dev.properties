# Development profile
jwt.secret=dev-only-secret-key-minimum-64-characters-long-replace-in-production-env

management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=always

logging.level.com.bodhganga=DEBUG
logging.level.org.springframework.security=DEBUG

# Cloud Storage (AWS S3) — safe mock defaults for local development profile
aws.access.key.id=${AWS_ACCESS_KEY_ID:mock-access-key-id-for-dev}
aws.secret.access.key=${AWS_SECRET_ACCESS_KEY:mock-secret-access-key-for-dev}
aws.region=eu-north-1
aws.s3.bucket.name=bodhganga-pdf-storage-prod

##################################################
# QUESTION BANK PIPELINE — Dev profile
##################################################
google.drive.qb.credentials=${QB_CREDENTIALS_PATH:classpath:google-qb-credentials.json}
google.drive.qb.source-folder-id=${QB_SOURCE_FOLDER_ID:}
google.drive.qb.archive-folder-id=${QB_ARCHIVE_FOLDER_ID:}
google.drive.qb.pipeline.enabled=${QB_PIPELINE_ENABLED:false}
google.drive.qb.sync-interval-ms=${QB_SYNC_INTERVAL_MS:180000}
