version: '3.9'

services:
  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: bodhganga-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS}
      MONGO_INITDB_DATABASE: bodhganga
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - bodhganga-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (Spring Boot) ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bodhganga-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      # ── State Pipeline credentials (read-only file mount) ───────────────────
      - ./secrets/google-credentials.json:/run/secrets/google-credentials.json:ro
      # ── Question Bank Pipeline credentials (read-only file mount) ─────────
      - ./secrets/google-qb-credentials.json:/run/secrets/google-qb-credentials.json:ro
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # -----------------------
      # Question Bank Pipeline
      # -----------------------
      QB_PIPELINE_ENABLED: ${QB_PIPELINE_ENABLED}
      QB_SOURCE_FOLDER_ID: ${QB_SOURCE_FOLDER_ID}
      QB_ARCHIVE_FOLDER_ID: ${QB_ARCHIVE_FOLDER_ID}
      QB_CREDENTIALS_PATH: ${QB_CREDENTIALS_PATH}
      GOOGLE_DRIVE_QB_PIPELINE_ENABLED: ${QB_PIPELINE_ENABLED}
      GOOGLE_DRIVE_QB_SOURCE_FOLDER_ID: ${QB_SOURCE_FOLDER_ID}
      GOOGLE_DRIVE_QB_ARCHIVE_FOLDER_ID: ${QB_ARCHIVE_FOLDER_ID}
      GOOGLE_DRIVE_QB_CREDENTIALS: ${QB_CREDENTIALS_PATH}
      # MongoDB
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASS}@mongodb:27017/bodhganga?authSource=admin
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      # Payment
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      # SMS / OTP
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      OTP_ENABLED: ${OTP_ENABLED:-true}
      # AWS S3
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-eu-north-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-bodhganga-pdf-storage-prod}
      # SMTP
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # CORS
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:80,http://localhost:5173}
      # Gemini AI
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      # State Material Pipeline
      GOOGLE_DRIVE_PIPELINE_ENABLED: ${GOOGLE_DRIVE_PIPELINE_ENABLED:-${QB_PIPELINE_ENABLED:-true}}
      GOOGLE_DRIVE_CREDENTIALS_PATH: ${GOOGLE_DRIVE_CREDENTIALS_PATH:-/run/secrets/google-credentials.json}
      GOOGLE_DRIVE_SOURCE_FOLDER_ID: ${GOOGLE_DRIVE_SOURCE_FOLDER_ID:-1jaRFORCmIJVqxDqznDIEVXYtKm6pmFJ4}
      GOOGLE_DRIVE_ARCHIVE_FOLDER_ID: ${GOOGLE_DRIVE_ARCHIVE_FOLDER_ID:-1-fydNZxMMAzMBGUh1nvQzYy9ixCd6b6W}
      # Question Bank Pipeline (independent credentials + config)
      QB_CREDENTIALS_PATH: /run/secrets/google-qb-credentials.json
      QB_PIPELINE_ENABLED: ${QB_PIPELINE_ENABLED:-false}
      QB_SOURCE_FOLDER_ID: ${QB_SOURCE_FOLDER_ID:-}
      QB_ARCHIVE_FOLDER_ID: ${QB_ARCHIVE_FOLDER_ID:-}
      QB_SYNC_INTERVAL_MS: ${QB_SYNC_INTERVAL_MS:-600000}
      # Explicit Spring property bindings for Docker env vars
      GOOGLE_DRIVE_QB_PIPELINE_ENABLED: ${QB_PIPELINE_ENABLED:-false}
      GOOGLE_DRIVE_QB_CREDENTIALS: /run/secrets/google-qb-credentials.json
      GOOGLE_DRIVE_QB_SOURCE_FOLDER_ID: ${QB_SOURCE_FOLDER_ID:-}
      GOOGLE_DRIVE_QB_ARCHIVE_FOLDER_ID: ${QB_ARCHIVE_FOLDER_ID:-}
      # YouTube
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YOUTUBE_CHANNEL_ID: ${YOUTUBE_CHANNEL_ID:-}
    ports:
      - "9090:9090"
    networks:
      - bodhganga-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Frontend (React + Nginx) ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://bodhganga.in/api}
    container_name: bodhganga-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - bodhganga-net

volumes:
  mongo_data:
    driver: local

networks:
  bodhganga-net:
    driver: bridge
